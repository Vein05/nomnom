name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  validate:
    name: Validate (Tests, Lint, Build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run gofmt (root)
        run: |
          files=$(find . -path ./desktop -prune -o -name '*.go' -print)
          out=$(gofmt -l $files)
          if [ -n "$out" ]; then echo "gofmt required:"; echo "$out"; exit 1; fi

      - name: Run gofmt (desktop)
        run: |
          files=$(find desktop -path desktop/frontend/wailsjs -prune -o -name '*.go' -print)
          out=$(gofmt -l $files)
          if [ -n "$out" ]; then echo "gofmt required:"; echo "$out"; exit 1; fi

      - name: Run go vet (root)
        run: go vet ./...

      - name: Run go vet (desktop)
        working-directory: desktop
        run: go vet ./...

      - name: Run root Go tests
        run: go test ./...

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build

      - name: Run desktop Go tests
        working-directory: desktop
        run: go test ./...

      - name: Run frontend tests
        working-directory: desktop/frontend
        run: npm test

  e2e:
    name: E2E Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    if: github.event_name != 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: desktop/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: desktop/e2e
        run: npx playwright install chromium

      - name: Build frontend for Wails
        working-directory: desktop/frontend
        run: npm run build

      - name: Start mock AI server
        working-directory: desktop/e2e
        run: |
          npx tsx mock-server.ts &
          echo "MOCK_PID=$!" >> "$GITHUB_ENV"
          sleep 2
          curl -s http://localhost:11435/health

      - name: Start Wails dev
        working-directory: desktop
        env:
          OLLAMA_HOST: http://localhost:11435
        run: |
          wails dev &
          echo "WAILS_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:34115 | grep -q "200\|302\|304"; then
              echo "Wails dev ready after ${i}s"
              break
            fi
            sleep 2
          done
          curl -s -o /dev/null -w "Final status: %{http_code}\n" http://localhost:34115

      - name: Run E2E tests
        working-directory: desktop/e2e
        run: npx playwright test

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            desktop/e2e/test-results/
            desktop/e2e/playwright-report/
          retention-days: 7

  e2e-windows:
    name: E2E Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    if: github.event_name != 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: desktop/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: desktop/e2e
        run: npx playwright install chromium

      - name: Build frontend for Wails
        working-directory: desktop/frontend
        run: npm run build

      - name: Start mock AI server
        working-directory: desktop/e2e
        shell: bash
        run: |
          npx tsx mock-server.ts &
          echo "MOCK_PID=$!" >> "$GITHUB_ENV"
          sleep 2
          curl -s http://localhost:11435/health

      - name: Start Wails dev
        working-directory: desktop
        shell: bash
        env:
          OLLAMA_HOST: http://localhost:11435
        run: |
          wails dev &
          echo "WAILS_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:34115 | grep -q "200\|302\|304"; then
              echo "Wails dev ready after ${i}s"
              break
            fi
            sleep 2
          done
          curl -s -o /dev/null -w "Final status: %{http_code}\n" http://localhost:34115

      - name: Run E2E tests
        working-directory: desktop/e2e
        run: npx playwright test

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-windows
          path: |
            desktop/e2e/test-results/
            desktop/e2e/playwright-report/
          retention-days: 7

  desktop-build:
    name: Desktop Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: darwin/universal
            artifact_name: nomnom-desktop-darwin-universal
          - name: Windows
            os: windows-latest
            platform: windows/amd64
            artifact_name: nomnom-desktop-windows-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build Wails desktop app
        working-directory: desktop
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: desktop/build/bin/*
          if-no-files-found: error
