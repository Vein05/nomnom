name: Build and Release Binaries

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  cli:
    name: Build CLI (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: amd64
            extension: ""
            runs_on: macos-13
          - os: darwin
            arch: arm64
            extension: ""
            runs_on: macos-latest
          - os: linux
            arch: amd64
            extension: ""
            runs_on: ubuntu-latest
          - os: linux
            arch: arm64
            extension: ""
            runs_on: ubuntu-latest
          - os: windows
            arch: amd64
            extension: ".exe"
            runs_on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libffi

      - name: Build mupdf 1.24.9 (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 --branch 1.24.9 --recursive https://github.com/ArtifexSoftware/mupdf.git /tmp/mupdf
          cd /tmp/mupdf
          make libs HAVE_X11=no HAVE_GLUT=no HAVE_LEPTONICA=no HAVE_TESSERACT=no USE_SYSTEM_ZLIB=yes -j$(sysctl -n hw.logicalcpu)

      - name: Build Binary (macOS with CGO)
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: -I/tmp/mupdf/include
          CGO_LDFLAGS: -L/tmp/mupdf/build/release -L/opt/homebrew/opt/libffi/lib -L/usr/local/opt/libffi/lib -lmupdf -lmupdf-third -lffi -lz
        run: |
          go build -v -tags "extlib static" -ldflags "-X nomnom/cmd.Version=${{ github.ref_name }}" -o "nomnom${{ matrix.extension }}"
          zip "nomnom-${{ matrix.os }}-${{ matrix.arch }}.zip" "nomnom${{ matrix.extension }}" LICENSE README.md config.example.json

      - name: Build Binary (Linux/Windows)
        if: runner.os != 'macOS'
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -v -ldflags "-X nomnom/cmd.Version=${{ github.ref_name }}" -o "nomnom${{ matrix.extension }}"
          zip "nomnom-${{ matrix.os }}-${{ matrix.arch }}.zip" "nomnom${{ matrix.extension }}" LICENSE README.md config.example.json

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: nomnom-${{ matrix.os }}-${{ matrix.arch }}.zip
          asset_name: nomnom-${{ matrix.os }}-${{ matrix.arch }}.zip
          asset_content_type: application/zip

  desktop:
    name: Build Desktop Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: darwin/universal
            asset_name: nomnom-desktop-darwin-universal.dmg
          - name: Windows
            os: windows-latest
            platform: windows/amd64
            asset_name: nomnom-desktop-windows-amd64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build Wails desktop app
        working-directory: desktop
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          hdiutil create -size 80m -volname "nomnom" -fs "APFS" -ov /tmp/nomnom-temp.dmg
          hdiutil attach /tmp/nomnom-temp.dmg -nobrowse
          cp -R desktop/build/bin/nomnom-desktop.app /Volumes/nomnom/
          ln -s /Applications /Volumes/nomnom/
          hdiutil detach /Volumes/nomnom/
          hdiutil convert /tmp/nomnom-temp.dmg -format UDZO -o ${{ matrix.asset_name }}

      - name: Archive Windows desktop binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path desktop/build/bin/desktop.exe -DestinationPath ${{ matrix.asset_name }}

      - name: Upload Desktop Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ matrix.asset_name }}
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: ${{ runner.os == 'macOS' && 'application/x-apple-diskimage' || 'application/zip' }}
