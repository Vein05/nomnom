name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - module: root
            working_directory: .
            gofmt_find: find . -path ./desktop -prune -o -name '*.go' -print
          - module: desktop
            working_directory: desktop
            gofmt_find: find . -path ./frontend/wailsjs -prune -o -name '*.go' -print

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Run go vet
        working-directory: ${{ matrix.working_directory }}
        run: go vet ./...

      - name: Check gofmt
        working-directory: ${{ matrix.working_directory }}
        run: |
          files=$(${{ matrix.gofmt_find }})
          if [ -n "$files" ]; then
            out=$(gofmt -l $files)
            if [ -n "$out" ]; then
              echo "gofmt required for:"
              echo "$out"
              exit 1
            fi
          fi